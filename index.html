    <!-- Un-media'd tag is the live one (updated by the theme toggle); the media pair covers
         the pre-JS moment for browsers that read them. -->
    <meta name="theme-color" content="#0b0d12" />
    <meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Theme must be decided before first paint or the page flashes the wrong colours.
      Order: explicit visitor choice (localStorage) → OS preference → dark (the brand default).
      Kept inline and dependency-free on purpose.
    -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light'
          }
        } catch (e) {
          /* storage blocked — fall through to dark */
        }
        document.documentElement.setAttribute('data-theme', theme)
        if (theme === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]:not([media])')
          if (meta) meta.setAttribute('content', '#f5f3ed')
        }
      })()
    </script>
