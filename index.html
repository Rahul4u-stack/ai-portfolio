<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rahul Agarwal - Product Manager & AI Builder. Portfolio showcasing AI projects and fintech expertise." />
    <meta name="author" content="Rahul Agarwal" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Applies a STORED theme choice before first paint (no flash). Dark is always the default;
      the site never opens light because of an OS preference. Light is reached only through
      the visible toggle.
    -->
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#f6f6f8')
          }
        } catch (e) {
          /* storage blocked; stay dark */
        }
      })()
    </script>

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rahul Agarwal | Product Manager & AI Builder" />
    <meta property="og:description" content="PM building AI products. 7+ years in fintech & payments. Portfolio of LLM-powered projects shipped fast with Claude Code." />
    <meta property="og:image" content="/profile.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rahul Agarwal | Product Manager & AI Builder" />
    <meta name="twitter:description" content="PM building AI products. 7+ years in fintech & payments. Portfolio of LLM-powered projects shipped fast with Claude Code." />
    <meta name="twitter:image" content="/profile.jpg" />

    <title>Rahul Agarwal | Product Manager & AI Builder</title>
  </head>
  <body class="bg-surface text-text-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
